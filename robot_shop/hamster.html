<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>햄스터 로봇 상세 정보</title>
    <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <section id="product-detail" style="max-width: 800px; margin: 100px auto; text-align: center; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>🤖 로봇 상세 정보</h2>
        
        <div class="detail-box" style="display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; margin-top: 40px; gap: 20px;">
            
            <div class="detail-img">
                <img src="hamster.png" alt="햄스터 로봇" style="width: 250px; height: 250px; border-radius: 15px; object-fit: cover;">
            </div>

            <div class="detail-info" style="text-align: left; max-width: 400px;">
                <h3>미니 햄스터 로봇 상세 스펙</h3>
                <p style="font-size: 20px; font-weight: bold; color: #e0da28; margin: 10px 0;">가격: 800,000원</p>
                <p style="line-height: 1.6; color: #666;">
                    주머니 속에 쏙 들어가는 크기로 언제 어디서나 함께하는 미니 로봇입니다. 
                    휴대성이 뛰어나고 귀여운 애교로 일상의 활력을 더해줍니다.
                </p>
                
                <button onclick="alert('장바구니에 담겼어요!')" style="background-color: #ffec45; color: #666; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px;">장바구니 담기</button>
                
                <br><br>
                <a href="index.html" style="color: #666; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold;">← 메인 화면으로 돌아가기</a>
            </div> 
        </div> 
    </section>
</body>
</html>
